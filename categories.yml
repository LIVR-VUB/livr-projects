# Project types shown on the LIVR Project Catalogue (public pages and Members area).
#
# CLASSIFICATION IS BY TOPIC ONLY.
#   A repository belongs to a project type if it carries ANY of the type's `topics`
#   (GitHub topics, exact match). A repository can belong to several types.
#   Repositories without a matching topic are listed as "Unclassified".
#
# `recommended` is the topic shown in the tag guide; ask members to use it.
#
# `keywords` never classify anything. They are only used to SUGGEST a type for
#   unclassified repositories whose name or description contains one of them
#   (case-insensitive). The suggestion is shown on the card with the recommended topic.
#
# To classify a repository: on GitHub, open it, click the gear icon next to "About"
# and add a topic. The Members area updates immediately; the public pages hourly.
#
# Fields: name, slug (used in addresses), icon, colour, description, recommended,
#         topics, keywords.
# Available icons: single-cell, bulk, dna, protein, flask, layers, cell-painting,
#   microscope, plate, network, server, book, report, tag

org: LIVR-VUB

# Which repositories the PUBLIC pages list: public | private | all
# The website is publicly accessible. Keep this on "public"; private repositories
# are shown only in the token-protected Members area.
visibility: public

exclude:
  - .github
  - .github-private
  - livr-projects

categories:
  - name: Single-cell RNA-seq
    slug: single-cell-rna-seq
    icon: single-cell
    colour: "#7c3aed"
    description: Single-cell and single-nucleus transcriptomics, including SPLiT-seq, clustering, annotation and cell atlases.
    recommended: scrna-seq
    topics: [scrna-seq, scrnaseq, single-cell, snrna-seq, splitseq, split-seq, hsc-atlas, cell-atlas]
    keywords: [scrna, single-cell, single cell, splitseq, split-seq]

  - name: Bulk RNA-seq
    slug: bulk-rna-seq
    icon: bulk
    colour: "#2563eb"
    description: Bulk transcriptomics, including QuantSeq, differential expression, enrichment and deconvolution.
    recommended: bulkrnaseq
    topics: [bulkrnaseq, bulk-rna-seq, rna-seq, rnaseq, quantseq, deconvolution, transcriptomics]
    keywords: [bulk rna, bulkrna, quantseq, rna-seq, rnaseq]

  - name: Proteomics
    slug: proteomics
    icon: protein
    colour: "#db2777"
    description: Mass-spectrometry proteomics and protein-level analyses.
    recommended: proteomics
    topics: [proteomics, bulkproteomics, bulk-proteomics]
    keywords: [proteomic]

  - name: Metabolomics and Lipidomics
    slug: metabolomics
    icon: flask
    colour: "#d97706"
    description: Metabolite and lipid profiling by mass spectrometry.
    recommended: metabolomics
    topics: [metabolomics, lipidomics, mass-spectrometry]
    keywords: [metabolomic, lipidomic]

  - name: Multi-omics
    slug: multi-omics
    icon: layers
    colour: "#0d9488"
    description: Integration of transcriptomic, proteomic, metabolomic and imaging data.
    recommended: multiomics
    topics: [multiomics, multi-omics, bulk-omics, spatial-transcriptomics, spatial-omics]
    keywords: [multiomic, multi-omic]

  - name: Cell Painting
    slug: cell-painting
    icon: cell-painting
    colour: "#c026d3"
    description: Cell Painting assays, CellProfiler and cytomining pipelines, and image-based morphological profiling.
    recommended: cellpainting
    topics: [cellpainting, cell-painting, cellprofiler, cytomining, image-based-profiling, high-content-screening, high-throughput, hcs]
    keywords: [cell painting, cellpainting, cytomining, cellprofiler, _cp_]

  - name: Microscopy and Image Analysis
    slug: image-analysis
    icon: microscope
    colour: "#0891b2"
    description: Quantitative microscopy and image processing, including segmentation, AFM and lipid-droplet analysis.
    recommended: image-analysis
    topics: [image-analysis, image-processing, microscopy, cellpose, cell-analysis, segmentation, afm, fenestrae, organoids, bodipy]
    keywords: [cellpose, segmentation, bodipy, afm, fenestra, organoid, microscop]

  - name: Plate Design and Lab Tools
    slug: lab-tools
    icon: plate
    colour: "#16a34a"
    description: Plate layouts, well maps and small utilities that support experiments at the bench.
    recommended: platemap
    topics: [platemap, plate-tools, 96well, 384well, lab-tools]
    keywords: [platemap, plate map, plate-map]

  - name: Machine Learning
    slug: machine-learning
    icon: network
    colour: "#4f46e5"
    description: Machine-learning and deep-learning models applied to the group's data.
    recommended: machine-learning
    topics: [machine-learning, deep-learning, ai, ml]
    keywords: [machine learning, deep learning, -ml, _ml]

  - name: Computing and Containers
    slug: computing
    icon: server
    colour: "#475569"
    description: Running analyses on the VSC/HPC cluster, Singularity and Docker containers, and workflow tooling.
    recommended: hpc
    topics: [hpc, hpc-containers, singularity-container, singularity, apptainer, docker, containers, vsc, hydra]
    keywords: [hpc, singularity, apptainer, container]

  - name: Lab Resources and Onboarding
    slug: resources
    icon: book
    colour: "#ea580c"
    description: Foundational repositories, shared tools, templates and onboarding material for new members.
    recommended: foundational-repository
    topics: [livr-onboarding, foundational-repository, tools, basic-tools, general, template, livr]
    keywords: [onboarding, template]

  - name: Reports and Publications
    slug: reports
    icon: report
    colour: "#0f766e"
    description: Final analysis versions and code accompanying manuscripts and reports.
    recommended: final-version
    topics: [jhep-reports, final-version, publication, manuscript, paper]
    keywords: [manuscript, publication]
