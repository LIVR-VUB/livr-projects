# Research areas shown on the LIVR Project Catalogue.
#
#   A repository is listed under an area if it carries ANY of that area's topics.
#   A repository can belong to several areas.
#   Repositories matching no area are listed as "Unclassified".
#
# To classify a repository: on GitHub, open the repository, click the gear icon
# next to "About" and add one of the topics below. The site updates hourly
# (or immediately: Actions -> "Build project catalogue" -> Run workflow).
#
# Edit freely: rename areas, reorder them, add topics. `slug` is used in the URL.

org: LIVR-VUB

# Which repositories the PUBLIC pages list: public | private | all
# The website is publicly accessible. Keep this on "public"; private repositories
# are shown only in the token-protected Members area.
visibility: public

exclude:
  - .github
  - .github-private
  - livr-projects

categories:
  - name: Transcriptomics
    slug: transcriptomics
    description: Bulk and single-cell RNA sequencing, cell-type deconvolution and gene-expression analysis.
    topics: [rna-seq, rnaseq, bulk-rna-seq, scrna-seq, scrnaseq, single-cell, transcriptomics, deconvolution]

  - name: Metabolomics and Lipidomics
    slug: metabolomics
    description: Mass-spectrometry workflows for metabolite and lipid profiling.
    topics: [metabolomics, lipidomics, mass-spectrometry]

  - name: Cell Painting and High-Content Screening
    slug: cell-painting
    description: Cell Painting assays, CellProfiler pipelines, plate layouts and morphological profiling.
    topics: [cell-painting, cellpainting, cellprofiler, cytomining, high-content-screening, hcs, platemap]

  - name: Imaging and Image Analysis
    slug: image-analysis
    description: Quantitative microscopy, including AFM, fenestration analysis, organoids and segmentation.
    topics: [image-analysis, microscopy, afm, fenestrae, organoids, segmentation, bodipy]

  - name: Spatial and Multi-omics
    slug: multiomics
    description: Spatial transcriptomics, proteomics and integration across molecular layers.
    topics: [spatial-transcriptomics, spatial-omics, multiomics, multi-omics, proteomics]

  - name: Machine Learning
    slug: machine-learning
    description: Statistical learning and deep-learning models applied to the group's data.
    topics: [machine-learning, deep-learning, ai]

  - name: Computing Infrastructure
    slug: infrastructure
    description: High-performance computing on VSC, software containers, instrument control and shared utilities.
    topics: [hpc, vsc, containers, singularity, apptainer, docker, bioreactor, infrastructure]
