site_name: Project Catalogue
site_description: Index of the analysis pipelines, research software and computational resources of the Liver Cell Biology Research Group (LIVR), Vrije Universiteit Brussel
site_author: Liver Cell Biology Research Group (LIVR), VUB
site_url: https://livr-vub.github.io/livr-projects/
repo_url: https://github.com/LIVR-VUB
repo_name: LIVR-VUB on GitHub
edit_uri: ""
copyright: Liver Cell Biology Research Group (LIVR) · Vrije Universiteit Brussel

theme:
  name: material
  language: en
  logo: assets/img/livr-logo.png
  favicon: assets/img/favicon.png
  font: false
  palette:
    scheme: default
    primary: custom
    accent: custom
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: false
  - pymdownx.details
  - pymdownx.superfences

extra:
  generator: false

extra_css:
  - assets/catalogue.css
extra_javascript:
  - assets/catalogue.js
